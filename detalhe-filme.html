<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe do Filme</title>
</head>
<body>

    <style>
   * {
       padding: 0;
       margin: 0;
       box-sizing: border-box;
   }

   body {
         background-color: aquamarine;
   }

  .conteudo { display: none; }
  .active { display: block; }

  </style>

  <div id="classe1" class="conteudo">
  <h1>Mantis</h1>
  <p>Descrição do filme 1</p>

   <style>

    body {
    background-image: url('imagens/NPBack.png');
    background-size: cover;     
    background-position: center; 
    background-repeat: no-repeat; 
    min-height: 100vh;         
   }

  </style>

</div>

<div id="classe2" class="conteudo">
  <h1>Filme 2</h1>
  <p>Descrição do filme 2</p>
</div>

<div id="classe3" class="conteudo">
  <h1>Filme 3</h1>
  <p>Descrição do filme 3</p>
</div>

<script>
  const classe = new URLSearchParams(window.location.search).get('classe'); 
  const elemento = document.getElementById(`classe${classe}`);
  if (elemento) elemento.classList.add('active');
</script>


   
</body>
</html>
